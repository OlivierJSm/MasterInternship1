[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hicdatautils"
version = "0.1.0"
description = "Provides tools to analyze Hi-C data with Optimal Transport"
authors = [
    { name="Olivier Smeets" }
]

[tool.setuptools]
packages = ["hicdatautils"]